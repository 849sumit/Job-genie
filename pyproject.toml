[project]
name = "job_genie_backend"
version = "0.1.0"
description = "Basic initial Python backend project for Job Genie."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.23",
    "sqlalchemy>=2.0",
    "httpx>=0.28"
]
authors = [
    {name = "Your Name", email = "you@example.com"}
]
license = {text = "MIT"}

[project.urls]
Homepage = "https://example.com"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
